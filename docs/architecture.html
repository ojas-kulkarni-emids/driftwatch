<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body{margin:0;background:#fff;font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  svg{display:block;}
  .t{font-size:13px;fill:#1b2027;font-weight:600;}
  .s{font-size:11px;fill:#6b7280;}
  .lbl{font-size:11px;fill:#475569;font-style:italic;}
  .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;fill:#1b2027;font-weight:600;}
  .box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;}
  .agent{fill:#eff6ff;stroke:#2563eb;stroke-width:1.8;}
  .local{fill:#eef2ff;stroke:#4338ca;stroke-width:1.5;}
  .net{fill:#fffbeb;stroke:#b45309;stroke-width:1.5;}
  .callout{fill:#f0fdf4;stroke:#15803d;stroke-width:1.5;}
  .ln{stroke:#64748b;stroke-width:1.5;fill:none;}
  .ln-d{stroke:#64748b;stroke-width:1.3;fill:none;stroke-dasharray:5 4;}
</style></head><body>
<svg viewBox="0 0 1080 700" width="1080" height="700" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Architecture: a browser sends a bump spec to a FastAPI server running a Strands agent on Azure OpenAI. The agent chooses among four tools per bump. find_usages and get_file_context read the local repo; get_changelog and search_github_issues call the GitHub API, with get_changelog falling back from the Releases API to the repo's changelog file. Only matched call-site snippets and changelog text enter the model context, never the repo itself.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Browser -->
  <rect class="box" x="390" y="24" width="300" height="58" rx="7"/>
  <text class="t" x="540" y="47" text-anchor="middle">Browser — one page</text>
  <text class="s" x="540" y="66" text-anchor="middle">bump form + live reasoning trace + verdicts</text>

  <!-- arrows browser <-> server -->
  <line class="ln" x1="470" y1="82" x2="470" y2="132" marker-end="url(#a)"/>
  <text class="lbl" x="462" y="105" text-anchor="end">bump spec</text>
  <line class="ln-d" x1="620" y1="132" x2="620" y2="82" marker-end="url(#a)"/>
  <text class="lbl" x="628" y="105">SSE: tool calls + verdict</text>

  <!-- Server / agent -->
  <rect class="agent" x="330" y="132" width="420" height="86" rx="7"/>
  <text class="t" x="540" y="157" text-anchor="middle">FastAPI server → Strands Agent</text>
  <text class="s" x="540" y="176" text-anchor="middle">Azure OpenAI (AsyncAzureOpenAI injected into OpenAIModel)</text>
  <text class="s" x="540" y="196" text-anchor="middle" font-style="italic">the model picks which tools to call, and in what order, per bump</text>
  <text class="s" x="540" y="211" text-anchor="middle">— no fixed sequence is coded —</text>

  <!-- fan-out lines to tools -->
  <line class="ln" x1="440" y1="218" x2="150" y2="286" marker-end="url(#a)"/>
  <line class="ln" x1="500" y1="218" x2="400" y2="286" marker-end="url(#a)"/>
  <line class="ln" x1="580" y1="218" x2="680" y2="286" marker-end="url(#a)"/>
  <line class="ln" x1="640" y1="218" x2="930" y2="286" marker-end="url(#a)"/>

  <!-- Tools row -->
  <rect class="local" x="30" y="288" width="240" height="76" rx="7"/>
  <text class="mono" x="150" y="311" text-anchor="middle">find_usages</text>
  <text class="s" x="150" y="331" text-anchor="middle">walks every .py, parses AST,</text>
  <text class="s" x="150" y="347" text-anchor="middle">resolves aliases + instance chains</text>

  <rect class="local" x="292" y="288" width="216" height="76" rx="7"/>
  <text class="mono" x="400" y="311" text-anchor="middle">get_file_context</text>
  <text class="s" x="400" y="331" text-anchor="middle">widens one already-found</text>
  <text class="s" x="400" y="347" text-anchor="middle">file:line — cannot browse</text>

  <rect class="net" x="566" y="288" width="228" height="76" rx="7"/>
  <text class="mono" x="680" y="311" text-anchor="middle">get_changelog</text>
  <text class="s" x="680" y="331" text-anchor="middle">two sources, tried in order</text>
  <text class="s" x="680" y="347" text-anchor="middle">(see below)</text>

  <rect class="net" x="818" y="288" width="232" height="76" rx="7"/>
  <text class="mono" x="934" y="311" text-anchor="middle">search_github_issues</text>
  <text class="s" x="934" y="331" text-anchor="middle">fallback evidence when the</text>
  <text class="s" x="934" y="347" text-anchor="middle">changelog says nothing useful</text>

  <!-- down to sources -->
  <line class="ln" x1="150" y1="364" x2="150" y2="470" marker-end="url(#a)"/>
  <text class="lbl" x="158" y="400">reads</text>
  <line class="ln" x1="380" y1="364" x2="240" y2="466" marker-end="url(#a)"/>
  <line class="ln" x1="680" y1="364" x2="680" y2="424" marker-end="url(#a)"/>
  <line class="ln" x1="934" y1="364" x2="934" y2="470" marker-end="url(#a)"/>

  <!-- changelog two-source detail -->
  <rect class="net" x="556" y="424" width="248" height="34" rx="6"/>
  <text class="s" x="680" y="446" text-anchor="middle">1. GitHub Releases API</text>
  <line class="ln" x1="680" y1="458" x2="680" y2="482" marker-end="url(#a)"/>
  <text class="lbl" x="690" y="475">if empty</text>
  <rect class="net" x="556" y="482" width="248" height="40" rx="6"/>
  <text class="s" x="680" y="499" text-anchor="middle">2. CHANGELOG.rst / .md via Contents API</text>
  <text class="s" x="680" y="514" text-anchor="middle" font-style="italic">sliced to the version range only</text>

  <!-- sources -->
  <rect class="local" x="30" y="470" width="240" height="52" rx="7"/>
  <text class="t" x="150" y="492" text-anchor="middle">Local repo</text>
  <text class="s" x="150" y="510" text-anchor="middle">never leaves the machine</text>

  <rect class="net" x="838" y="470" width="212" height="52" rx="7"/>
  <text class="t" x="944" y="492" text-anchor="middle">GitHub REST API</text>
  <text class="s" x="944" y="510" text-anchor="middle">PAT — 5,000 req/hr</text>

  <!-- callout -->
  <rect class="callout" x="120" y="566" width="840" height="104" rx="7"/>
  <text class="t" x="540" y="592" text-anchor="middle">The repo never enters the model's context.</text>
  <text class="s" x="540" y="615" text-anchor="middle">The AST scan is deterministic, exhaustive and free — it runs to completion before the model sees anything.</text>
  <text class="s" x="540" y="635" text-anchor="middle">Only the matched call-site snippets and the changelog text cross into the prompt, so cost scales with how much</text>
  <text class="s" x="540" y="655" text-anchor="middle">one library is used — not with repo size. A 500-file repo costs about the same as a 5-file one.</text>
</svg>
</body></html>
